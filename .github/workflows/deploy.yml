# Based on the workflow generated by `jupyter book init --gh-pages` (Jupyter Book 2.1).
# Repository settings → Pages → Source must be set to "GitHub Actions".

name: Jupyter Book GitHub Pages Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # The site is served from https://mis-devops-purdue.github.io/setup-guide/,
  # so assets must be built relative to /setup-guide or styling breaks.
  BASE_URL: /setup-guide

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install Jupyter Book
        run: npm install -g jupyter-book@2
      - name: Build HTML Assets
        run: jupyter-book build --html --strict
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
